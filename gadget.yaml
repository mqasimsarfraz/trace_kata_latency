name: trace_kata_latency
description: Trace kubelet CRI sandbox and container latency for Kata Containers
homepageURL: https://github.com/mqasimsarfraz/trace_container_latency
sourceURL: https://github.com/mqasimsarfraz/trace_container_latency
datasources:
  kata_latency_metrics:
    annotations:
      metrics.collect: "true"
      metrics.print: "true"
      cli.clear-screen-before: "true"
    fields:
      operation:
        annotations:
          description: CRI lifecycle operation
          metrics.type: key
      runtime_handler:
        annotations:
          description: Kata CRI runtime handler
          metrics.type: key
      latency_us:
        annotations:
          metrics.description: CRI operation latency distribution
          metrics.unit: µs
